services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bottari
      POSTGRES_PASSWORD: bottari
      POSTGRES_DB: bottari
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bottari -d bottari"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - bottari-db:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://bottari:bottari@db:5432/bottari?schema=public
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-500}
      PROCESSING_FEE_BPS: ${PROCESSING_FEE_BPS:-300}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "pnpm db:push && pnpm db:seed && pnpm start"
volumes:
  bottari-db:
