name: ci
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bottari
          POSTGRES_PASSWORD: bottari
          POSTGRES_DB: bottari
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bottari -d bottari"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://bottari:bottari@localhost:5432/bottari?schema=public
      PLATFORM_FEE_BPS: '500'
      PROCESSING_FEE_BPS: '300'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:push
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build
      - run: docker build -t bottari-ci .
